pid /tmp/nginx.pid;

events {}

http {
    access_log /dev/stdout;
    error_log /dev/stderr;

    server {
        listen 8080;
        server_name _;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
}